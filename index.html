<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testa o Croce</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      color: #38bdf8;
    }
    .sottotitolo {
      margin: 0 0 24px;
      color: #94a3b8;
    }
    .tabellone {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .box .label { font-size: 0.85rem; color: #94a3b8; }
    .box .valore { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
    .verde { color: #4ade80; }
    .rosso { color: #f87171; }
    .giallo { color: #facc15; }

    .bottoni {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button {
      flex: 1;
      min-width: 140px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    button:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-testa { background: #0284c7; color: #fff; }
    .btn-croce { background: #d97706; color: #fff; }
    .btn-reset { background: #475569; color: #f8fafc; }

    .banner {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 600;
      text-align: center;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid #38bdf8;
    }
    .nascosto { display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      margin-top: 8px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }
    th { color: #94a3b8; font-weight: 600; }
    .badge-win { color: #4ade80; font-weight: 700; }
    .badge-lose { color: #f87171; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Testa o Croce</h1>
    <p class="sottotitolo">Sfida il PC su 5 lanci: 0 = Testa, 1 = Croce.</p>

    <div class="tabellone">
      <div class="box">
        <div class="label">Turno</div>
        <div id="turno-valore" class="valore giallo">1/5</div>
      </div>
      <div class="box">
        <div class="label">Punti Utente</div>
        <div id="punti-utente" class="valore verde">0</div>
      </div>
      <div class="box">
        <div class="label">Punti PC</div>
        <div id="punti-pc" class="valore rosso">0</div>
      </div>
    </div>

    <div id="banner-finale" class="banner nascosto"></div>

    <div id="controlli-gioco" class="bottoni">
      <button type="button" class="btn-testa" onclick="giocaTurno(0)">Scegli 0 - Testa</button>
      <button type="button" class="btn-croce" onclick="giocaTurno(1)">Scegli 1 - Croce</button>
      <button type="button" class="btn-reset" onclick="nuovaPartita()">Ricomincia</button>
    </div>

    <div id="controlli-fine" class="bottoni nascosto">
      <button type="button" class="btn-reset" onclick="nuovaPartita()">Gioca ancora</button>
    </div>

    <table id="tabella-cronologia" class="nascosto">
      <thead>
        <tr>
          <th>Turno</th>
          <th>Tua scelta</th>
          <th>Uscito</th>
          <th>Esito</th>
        </tr>
      </thead>
      <tbody id="corpo-cronologia"></tbody>
    </table>
  </div>

  <script>
    const MAX_TURNI = 5;
    const ETICHETTE = { 0: "Testa", 1: "Croce" };

    let turno = 1;
    let puntiUtente = 0;
    let puntiPc = 0;
    let cronologia = [];
    let finita = false;

    function nuovaPartita() {
      turno = 1;
      puntiUtente = 0;
      puntiPc = 0;
      cronologia = [];
      finita = false;
      aggiornaSchermo();
    }

    function giocaTurno(scelta) {
      if (finita) return;

      const esito = Math.floor(Math.random() * 2); // 0 oppure 1
      const turnoCorrente = turno;
      let esitoTurno = "pc";
      let messaggio = "Ha indovinato il PC! +1 punto per il PC.";

      if (scelta === esito) {
        puntiUtente += 1;
        esitoTurno = "utente";
        messaggio = "Hai indovinato! +1 punto per te.";
      } else {
        puntiPc += 1;
      }

      cronologia.push({
        turno: turnoCorrente,
        scelta: `${scelta} (${ETICHETTE[scelta]})`,
        esito: `${esito} (${ETICHETTE[esito]})`,
        esitoTurno,
        messaggio
      });

      if (turnoCorrente >= MAX_TURNI) {
        finita = true;
      } else {
        turno += 1;
      }

      aggiornaSchermo();
    }

    function aggiornaSchermo() {
      document.getElementById("turno-valore").textContent = `${finita ? MAX_TURNI : turno}/${MAX_TURNI}`;
      document.getElementById("punti-utente").textContent = puntiUtente;
      document.getElementById("punti-pc").textContent = puntiPc;

      const banner = document.getElementById("banner-finale");
      const ctrlGioco = document.getElementById("controlli-gioco");
      const ctrlFine = document.getElementById("controlli-fine");

      if (finita) {
        banner.classList.remove("nascosto");
        ctrlGioco.classList.add("nascosto");
        ctrlFine.classList.remove("nascosto");

        if (puntiUtente > puntiPc) {
          banner.innerHTML = `<span class="verde">Partita terminata: hai vinto tu (${puntiUtente} a${puntiPc})!</span>`;
        } else if (puntiPc > puntiUtente) {
          banner.innerHTML = `<span class="rosso">Partita terminata: ha vinto il PC (${puntiPc} a${puntiUtente})!</span>`;
        } else {
          banner.innerHTML = `<span class="giallo">Partita terminata in pareggio (${puntiUtente} a${puntiPc})!</span>`;
        }
      } else {
        banner.classList.add("nascosto");
        ctrlGioco.classList.remove("nascosto");
        ctrlFine.classList.add("nascosto");
      }

      const tabella = document.getElementById("tabella-cronologia");
      const corpo = document.getElementById("corpo-cronologia");
      corpo.innerHTML = "";

      if (cronologia.length > 0) {
        tabella.classList.remove("nascosto");
        [...cronologia].reverse().forEach((riga) => {
          const tr = document.createElement("tr");
          const classeEsito = riga.esitoTurno === "utente" ? "badge-win" : "badge-lose";
          tr.innerHTML = `
            <td>#${riga.turno}</td>
            <td>${riga.scelta}</td>
            <td>${riga.esito}</td>
            <td class="${classeEsito}">${riga.messaggio}</td>
          `;
          corpo.appendChild(tr);
        });
      } else {
        tabella.classList.add("nascosto");
      }
    }
  </script>
</body>
</html>
